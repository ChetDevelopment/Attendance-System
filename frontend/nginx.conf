server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never serve dotfiles
  location ~ /\. {
    return 404;
  }

  # Cache static assets aggressively
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback (Vue Router history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }
}

