name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/attdenance-backend ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/attdenance-frontend ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/attdenance-backend
          docker push ${{ secrets.DOCKER_USERNAME }}/attdenance-frontend

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Attendance-System
            git pull origin main
            # Injecting the Docker Username into the environment
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker compose pull
            docker compose up -d --force-recreate