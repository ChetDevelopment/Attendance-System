version: "3"

services:
  backend:
    build: ./backend
    container_name: laravel_app
    volumes:
      - ./backend:/var/www
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    container_name: vue_app
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend/dist
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  database:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: root
      MYSQL_PASSWORD: 
    ports:
      - "3306:3306"
