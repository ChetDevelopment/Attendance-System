services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      # This line is what replaces the "Welcome to nginx" page
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: vichet12/attdenance-backend
    container_name: laravel_app
    # ... rest of your backend config

  frontend:
    image: vichet12/attdenance-frontend
    container_name: vue_app
    # ... rest of your frontend config