server { 
    listen 80; 
    server_name 35.171.154.228; 
 
    # Where the Vite 'dist' folder is copied in the Dockerfile 
    root /usr/share/nginx/html; 
    index index.html; 
 
    # Support Vue Router (Single Page Application) 
    location / { 
        try_files $uri $uri/ /index.html; 
    } 
 
    # API Proxy (Routes requests from Frontend to Backend Container) 
    location /api/ { 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header Host $http_host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-Proto $scheme; 
         
        # This points to the service name in your docker-compose 
        proxy_pass http://laravel_backend:9000;  
    } 
 
    # Caching for static assets (Images, CSS, JS) 
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ { 
        expires 6M; 
        access_log off; 
        add_header Cache-Control "public"; 
    } 
 
    # Security headers 
    add_header X-Frame-Options "SAMEORIGIN"; 
    add_header X-XSS-Protection "1; mode=block"; 
    add_header X-Content-Type-Options "nosniff"; 
 
    error_page 404 /index.html; 
} 