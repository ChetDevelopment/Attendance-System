name: Build & Deploy 

on: 
  push: 
    branches: [main] 

jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Tests 
        run: | 
          cd backend 
          cp .env.example .env
          composer install 
          php artisan key:generate
          php artisan test 

  build-and-push: 
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build & Push Backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }} 

      - name: Build & Push Frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest 

  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4 # Gets the files from your GitHub repo

      - name: Copy Config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Copy only deploy-time files and Laravel source, not runtime storage/cache data
          source: "docker-compose.yml,backend/app,backend/bootstrap,backend/config,backend/database,backend/public,backend/resources,backend/routes,backend/artisan,backend/composer.json,backend/composer.lock,backend/package.json,backend/phpunit.xml,backend/vite.config.js,backend/.env.example,backend/nginx"
          target: "/home/ubuntu/Attendance-System"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: | 
            cd /home/ubuntu/Attendance-System
            
            # 1. Pull the images using the file we just uploaded
            docker compose pull 
            
            # 2. Start everything
            docker compose up -d --remove-orphans 
            
            # 3. Ensure Laravel writable paths exist and are writable
            mkdir -p backend/storage/framework/cache/data backend/storage/framework/sessions backend/storage/framework/views backend/storage/app/public backend/bootstrap/cache
            sudo chown -R $USER:$USER backend/storage backend/bootstrap/cache
            sudo chmod -R 775 backend/storage backend/bootstrap/cache

            # 4. Run Laravel commands (matching your service names)
            sleep 5
            docker compose exec -T backend php artisan migrate --force 
            docker compose exec -T backend php artisan optimize
