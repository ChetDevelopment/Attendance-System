name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/attendance-backend ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/attendance-frontend ./frontend

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/attendance-backend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/attendance-frontend

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          port: 22 # Ensure this is exactly aligned under 'host'
          script: |
            sudo docker pull vichet12/attendance-backend
            sudo docker pull vichet12/attendance-frontend

            sudo docker stop laravel_app || true
            sudo docker stop vue_app || true

            sudo docker rm laravel_app || true
            sudo docker rm vue_app || true

            sudo docker run -d -p 9000:9000 --name laravel_app vichet12/attendance-backend
            sudo docker run -d -p 80:5173 --name vue_app vichet12/attendance-frontend
