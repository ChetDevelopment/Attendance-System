name: Build & Deploy 

on: 
  push: 
    branches: [main] 

jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Tests 
        run: | 
          cd backend 
          cp .env.example .env
          composer install 
          php artisan key:generate
          php artisan test 

  build-and-push: 
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build & Push Backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }} 

      - name: Build & Push Frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest 

  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest 
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: | 
            cd /home/ubuntu/Attendance-System
            
            # 1. Pull latest images
            docker compose pull 
            
            # 2. Start (or restart) the containers
            # The -d runs it in the background
            docker compose up -d --remove-orphans 
            
            # 3. Wait 5 seconds to ensure the backend container is initialized
            sleep 5
            
            # 4. Run your Laravel commands
            # Using 'docker compose exec' is often more reliable than 'docker exec'
            docker compose exec -T backend php artisan migrate --force 
            docker compose exec -T backend php artisan optimize