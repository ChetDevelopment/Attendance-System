name: Build & Deploy 

on: 
  push: 
    branches: [main] 

jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Tests 
        run: | 
          cd backend 
          cp .env.example .env
          composer install 
          php artisan key:generate
          php artisan test 

  build-and-push: 
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build & Push Backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }} 

      - name: Build & Push Frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest 

  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest 
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: | 
            # 1. Set the correct path (Update 'folder_name' to your actual folder!)
            APP_DIR="/home/ubuntu/Attendance-System"

            # 2. Check if the directory even exists
            if [ ! -d "$APP_DIR" ]; then
              echo "❌ ERROR: Directory $APP_DIR does not exist on the server!"
              echo "Available folders in /home/ubuntu are:"
              ls -F /home/ubuntu
              exit 1
            fi

            cd $APP_DIR

            # 3. Check if the docker-compose file exists here
            if [ ! -f "docker-compose.yml" ] && [ ! -f "docker-compose.yaml" ]; then
              echo "❌ ERROR: No docker-compose file found in $APP_DIR"
              echo "Files currently in this folder:"
              ls -la
              exit 1
            fi

            # 4. If everything is okay, run the deployment
            echo "✅ Found config. Starting deployment..."
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Use the service name 'backend' from your YAML
            echo "Waiting for backend to stabilize..."
            sleep 5
            docker compose exec -T backend php artisan migrate --force
            docker compose exec -T backend php artisan optimize