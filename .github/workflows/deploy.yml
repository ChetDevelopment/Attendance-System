name: Build & Deploy 

on: 
  push: 
    branches: [main] 

jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Tests 
        run: | 
          cd backend 
          cp .env.example .env
          composer install 
          php artisan key:generate
          php artisan test 

  build-and-push: 
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build & Push Backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }} 

      - name: Build & Push Frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest 

  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4 # Gets the files from your GitHub repo

      - name: Prepare Deploy Folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/Attendance-System
            sudo chown -R $USER:$USER /home/ubuntu/Attendance-System

      - name: Copy Config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          overwrite: true
          # Copy only deploy-time files and Laravel source, not runtime storage/cache data
          source: "docker-compose.yml,backend/app,backend/bootstrap,backend/config,backend/database,backend/public,backend/resources,backend/routes,backend/artisan,backend/composer.json,backend/composer.lock,backend/package.json,backend/phpunit.xml,backend/vite.config.js,backend/.env.example,backend/nginx"
          target: "/home/ubuntu/Attendance-System"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: | 
            cd /home/ubuntu/Attendance-System

            # 0. Create the Compose and Laravel environment files on the server
            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            cat > backend/.env <<EOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=
            APP_DEBUG=false
            APP_URL=http://localhost

            LOG_CHANNEL=stack
            LOG_DEPRECATIONS_CHANNEL=null
            LOG_LEVEL=debug

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=attendance_system
            DB_USERNAME=root
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            BROADCAST_DRIVER=log
            CACHE_DRIVER=redis
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=file
            SESSION_LIFETIME=120

            MEMCACHED_HOST=127.0.0.1

            REDIS_HOST=redis
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_PORT=6379

            MAIL_MAILER=smtp
            MAIL_HOST=mailpit
            MAIL_PORT=1025
            MAIL_USERNAME=null
            MAIL_PASSWORD=null
            MAIL_ENCRYPTION=null
            MAIL_FROM_ADDRESS="hello@example.com"
            MAIL_FROM_NAME="\${APP_NAME}"

            AWS_ACCESS_KEY_ID=
            AWS_SECRET_ACCESS_KEY=
            AWS_DEFAULT_REGION=us-east-1
            AWS_BUCKET=
            AWS_USE_PATH_STYLE_ENDPOINT=false

            PUSHER_APP_ID=
            PUSHER_APP_KEY=
            PUSHER_APP_SECRET=
            PUSHER_HOST=
            PUSHER_PORT=443
            PUSHER_SCHEME=https
            PUSHER_APP_CLUSTER=mt1

            VITE_APP_NAME="\${APP_NAME}"
            VITE_PUSHER_APP_KEY="\${PUSHER_APP_KEY}"
            VITE_PUSHER_HOST="\${PUSHER_HOST}"
            VITE_PUSHER_PORT="\${PUSHER_PORT}"
            VITE_PUSHER_SCHEME="\${PUSHER_SCHEME}"
            VITE_PUSHER_APP_CLUSTER="\${PUSHER_APP_CLUSTER}"

            TIMETABLE_EVENTS_URL=https://timetables2.pnc.passerellesnumeriques.org/api/v1/google/events
            TIMETABLE_GOOGLE_CALENDAR_ID=c_1886h91qonri4ig0noe2vrfvp8fb8@resource.calendar.google.com
            TEACHER_CALENDAR_ID=c_1886h9lqonri4ig0noe2vrfvp8fb8@resource.calendar.google.com
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            
            # 1. Pull the images using the file we just uploaded
            docker compose pull 
            
            # 2. Start everything
            docker compose up -d --remove-orphans 
            
            # 3. Ensure Laravel writable paths exist and are writable
            mkdir -p backend/storage/framework/cache/data backend/storage/framework/sessions backend/storage/framework/views backend/storage/app/public backend/bootstrap/cache
            sudo chown -R $USER:$USER backend/storage backend/bootstrap/cache
            sudo chmod -R 775 backend/storage backend/bootstrap/cache

            # 4. Install Laravel dependencies on the host-mounted backend volume
            docker compose exec -T backend composer install --no-interaction --no-dev --optimize-autoloader

            # 5. Run Laravel commands (matching your service names)
            sleep 5
            docker compose exec -T backend php artisan key:generate --force
            docker compose exec -T backend php artisan migrate --force 
            docker compose exec -T backend php artisan optimize
