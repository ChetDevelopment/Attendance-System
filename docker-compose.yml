version: "3.8"

services:
  backend:
    image: ${DOCKER_USERNAME}/attdenance-backend
    container_name: laravel_app
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: vanda_db
      DB_USERNAME: user
      DB_PASSWORD: secret

  frontend:
    image: ${DOCKER_USERNAME}/attdenance-frontend
    container_name: vue_app
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  database:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: vanda_db
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
