name: Build & Deploy 

on: 
  push: 
    branches: [main] 

jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run PHP Tests 
        run: | 
          cd backend 
          cp .env.example .env
          composer install 
          php artisan key:generate
          php artisan test 

  build-and-push: 
    needs: test 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 

      - name: Login to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build & Push Backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest 
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }} 

      - name: Build & Push Frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          push: true 
          tags: | 
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest 

  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest 
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: | 
            cd /home/ubuntu/folder_name 
            
            # 1. Pull the new images from Docker Hub
            docker compose pull 
            
            # 2. Restart containers with the updated images
            docker compose up -d --remove-orphans 
            
            # 3. Run migrations and optimization inside the backend container
            # Using 'laravel_backend' to match your docker-compose.yml
            docker exec laravel_backend php artisan migrate --force 
            docker exec laravel_backend php artisan optimize
            
            # 4. Fix folder permissions (standard for Laravel on Linux)
            docker exec laravel_backend chown -R www-data:www-data storage bootstrap/cache