version: "3"

services:

  backend:
    build: ./backend
    container_name: laravel_app
    volumes:
      - ./backend:/var/www
    ports:
      - "9000:9000"
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: vue_app
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend/dist
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  database:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: