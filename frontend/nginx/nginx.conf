server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Where the Vite 'dist' folder is located in the container
    root /usr/share/nginx/html;
    index index.html;

    # 1. Support Vue Router (Fixes 404/500 on refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. API Proxy (Directly to PHP-FPM)
    location ~ ^/api/ {
        fastcgi_pass laravel_backend:9000;
        
        # This path must match the path inside the 'laravel_backend' container
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass real IP and Host info
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_HOST $http_host;
    }

    # 3. Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}